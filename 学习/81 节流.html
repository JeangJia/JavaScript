<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 200px;
        height: 200px;
        background-color: #ccc;
        line-height: 200px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div>0</div>
    <script>
      let count = 0
      const add = () => {
        document.querySelector('div').innerHTML = ++count
      }

      // 节流: 在 delay 时间内最多执行一次(固定频率)
      // 与防抖的区别:
      //   防抖 debounce: 事件不停触发就【一直不执行】, 停下来 delay 后才执行最后一次
      //   节流 throttle: 事件持续触发也【按固定频率执行】, 不会一直等待

      // 写法1: 时间戳版(推荐) —— 第一次触发立即执行, 之后每隔 delay 最多执行一次
      const throttle = (fn, delay = 1000) => {
        let lastTime = 0 // 上一次执行的时间戳; 初值为 0, 所以第一次触发一定满足条件
        return function () {
          const now = Date.now() // 也可以是 +new Date()
          if (now - lastTime >= delay) {
            // 距离上次执行已经超过 delay, 这次可以执行
            fn.apply(this, arguments) // 把 this 和参数转交给原函数
            lastTime = now // 记录本次执行时间
          }
          // 没到时间就什么都不做, 直接忽略这次触发
        }
      }

      document.querySelector('div').addEventListener('mousemove', throttle(add, 1000))

      /* ---------- 写法2: 定时器版(首次延迟 delay 执行, 最后一次一定执行) ----------
      const throttle2 = (fn, delay = 1000) => {
        let timer = null
        return function () {
          if (timer) return // 已经有定时器在排队, 本次触发直接忽略
          timer = setTimeout(() => {
            fn.apply(this, arguments)
            timer = null // 执行完清空, 允许下一次触发再开一个定时器
          }, delay)
        }
      }

      两版差异:
        时间戳版: 立即执行【第一次】, 但停止触发时若未到间隔, 最后一次不会执行
        定时器版: 第一次要等 delay 才执行, 但停止触发后【最后一次】一定会执行
        完整版 = 时间戳 + 定时器 结合: 立即执行第一次, 且保证最后一次也执行
      ----------------------------------------------------------------------- */
    </script>
  </body>
</html>
