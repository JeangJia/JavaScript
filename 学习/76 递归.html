<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2></h2>
    <script>
      const curtime = () => {
        let date = new Date()
        const pad = (n) => String(n).padStart(2, '0')
        return `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`
      }

      document.querySelector('h2').innerHTML = curtime()
      const f = () => {
        console.log(curtime())
        document.querySelector('h2').innerHTML = curtime()
      }

      const run = () => {
        setTimeout(run, 1000)
        f()
      }
      run()
    </script>
  </body>
</html>
