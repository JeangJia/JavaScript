<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 200px;
        height: 200px;
        background-color: #ccc;
        line-height: 200px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div>0</div>
    <script>
      let count = 0
      const add = () => {
        document.querySelector('div').innerHTML = ++count
      }
      const debounce = (fn, delay = 500) => {
        let timer = null
        return function () {
          if (timer) {
            clearTimeout(timer)
          }
          timer = setTimeout(() => {
            fn()
            // console.log(this)
            // fn.apply(this)
          }, delay)
        }
      }
      document.querySelector('div').addEventListener('mousemove', debounce(add, 1000))
    </script>
  </body>
</html>
