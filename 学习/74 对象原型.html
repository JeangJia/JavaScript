<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function Star(name, age) {
        this.name = name
        this.age = age
      }
      Star.prototype = {
        constructor: Star,
        sing: function () {
          console.log('唱歌')
        },
      }
      const a = new Star('张三', 18)
      a.sing()
      console.log(a.constructor == Star)
      // 1. 实例的 __proto__ 指向构造函数的 prototype（也就是原型对象）
      console.log(a.__proto__ == Star.prototype)
      // 2. a.constructor 拿到构造函数 Star, 再取它的 prototype 属性即可访问原型对象
      console.log(a.constructor.prototype == Star.prototype)
      // 3. 原型对象的 constructor 属性指回构造函数
      console.log(Star.prototype.constructor == Star)
      // 4. 等价写法: 实例的 __proto__ 等于它构造函数的 prototype, 三者互为印证
      console.log(a.__proto__ == a.constructor.prototype)
      // 5. 实例自己没有 constructor 属性, a.constructor 是沿原型链继承来的,
      //    而 a.__proto__ 就是原型对象, 两条路径最终找到的是同一个值, 所以恒为 true
      //    注意: 这行不能用来检验 constructor 有没有写对 —— 漏写时两边都会退回 Object, 仍然相等
      //    要检验是否写对, 应该直接比较: console.log(a.constructor === Star)
      console.log(a.__proto__.constructor == a.constructor)
    </script>
  </body>
</html>
