<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function Star(name, age) {
        this.name = name
        this.age = age
      }
      Star.prototype = {
        constructor: Star,
        sing: function () {
          console.log('唱歌')
        },
      }
      const a = new Star('张三', 18)
      a.sing()
      // 1. 实例的 __proto__ 指向构造函数的 prototype（也就是原型对象）
      //   console.log(a.__proto__ == Star.prototype)
    </script>
  </body>
</html>
